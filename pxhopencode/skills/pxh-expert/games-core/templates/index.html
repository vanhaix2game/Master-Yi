<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Game powered by pxhopencode" />
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: oklch(0.05 0 0); touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    #app, #game { width: 100%; height: 100%; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: oklch(0.08 0 0); color: oklch(0.9 0 0); font: 16px 'Segoe UI', system-ui, sans-serif;
      z-index: 9999; flex-direction: column; gap: 20px; transition: opacity 0.6s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .title { font-size: 1.3em; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(135deg, oklch(0.7 0.25 200), oklch(0.65 0.25 30)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #loading-bar { width: 220px; height: 3px; background: oklch(0.2 0 0); border-radius: 2px; overflow: hidden; }
    #loading-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, oklch(0.7 0.25 200), oklch(0.65 0.25 30)); transition: width 0.3s; border-radius: 2px; }
    #loading .hint { font-size: .78em; color: oklch(0.5 0 0); }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">Loading</div>
    <div id="loading-bar"><div id="loading-bar-fill"></div></div>
    <div class="hint">preparing assets...</div>
  </div>
  <div id="app"></div>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
